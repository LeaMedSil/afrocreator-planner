<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E2237">
<title>Planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E2237'/%3E%3Crect x='6' y='20' width='5' height='6' rx='1' fill='%230DF6FE'/%3E%3Crect x='13.5' y='13' width='5' height='13' rx='1' fill='%230DF6FE'/%3E%3Crect x='21' y='6' width='5' height='20' rx='1' fill='%232EE59D'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="tema.css">
</head>
<body>
<header class="topo">
  <div class="marca"><span class="marca-nome" id="marca-nome"></span><span class="marca-sub" id="marca-sub"></span></div>

  <nav class="visoes" aria-label="Visão">
    <button type="button" data-visao="roteiros" aria-pressed="true">Roteiros</button>
    <button type="button" data-visao="posts" aria-pressed="false">Posts</button>
    <button type="button" data-visao="metricas" aria-pressed="false" id="aba-metricas">Métricas</button>
  </nav>

  <div class="mes">
    <button type="button" class="icone" id="mes-ant" aria-label="Mês anterior">‹</button>
    <h1 id="mes-titulo" aria-live="polite"></h1>
    <button type="button" class="icone" id="mes-prox" aria-label="Próximo mês">›</button>
    <button type="button" class="leve" id="hoje">Hoje</button>
  </div>

  <button type="button" class="primario" id="novo">Novo roteiro</button>
</header>

<div class="barra">
  <div class="filtro" id="filtro" hidden role="group" aria-label="Filtrar por rede">
    <button type="button" data-rede="" aria-pressed="true">Todas as redes</button>
  </div>
  <p class="resumo" id="resumo" aria-live="polite"></p>
</div>

<section class="metricas" id="metricas" hidden aria-live="polite"></section>

<main id="calendario">
  <div class="semana" aria-hidden="true">
    <span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span><span>Dom</span>
  </div>
  <div class="grade" id="grade" aria-busy="true"></div>
  <p class="erro-grade" id="erro-grade" hidden></p>
</main>

<div class="veu" id="veu" hidden></div>
<aside class="painel" id="painel" hidden role="dialog" aria-modal="true" aria-labelledby="painel-titulo">
  <div class="painel-topo">
    <h2 id="painel-titulo"></h2>
    <button type="button" class="icone" id="fechar" aria-label="Fechar">×</button>
  </div>
  <form id="form" novalidate></form>
</aside>

<div class="aviso" id="aviso" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
